<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>밤새비서 클리퍼 설정</title>
<style>
  :root{ --ink:#191F28; --sub:#6B7684; --line:#E5E8EB; --accent:#3182F6;
         --ok:#12805C; --bad:#D4342C; }
  body{ max-width:360px; margin:44px auto; font-family:system-ui,"Malgun Gothic",sans-serif;
        color:var(--ink); font-size:14px; padding:0 20px; }
  .brand{ font-weight:700; font-size:18px; margin-bottom:4px; }
  .brand span{ color:var(--accent); }
  .hint{ color:var(--sub); font-size:12px; line-height:1.6; margin-bottom:20px; }
  label{ display:block; font-size:12px; color:var(--sub); margin:12px 0 4px; }
  input{ width:100%; box-sizing:border-box; border:1px solid var(--line);
         border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; }
  input:focus{ outline:none; border-color:var(--accent); }
  button{ width:100%; border:none; border-radius:8px; padding:11px; font-size:14px;
          font-weight:700; color:#fff; background:var(--accent); cursor:pointer;
          font-family:inherit; margin-top:16px; }
  .ghost{ background:none; color:var(--sub); font-weight:500; font-size:12px; margin-top:10px; }
  #msg{ font-size:13px; margin-top:14px; min-height:18px; }
  #msg.ok{ color:var(--ok); } #msg.bad{ color:var(--bad); }
  .state{ background:#F0FDF4; border:1px solid #BBF7D0; color:#12805C; border-radius:8px;
          padding:11px 13px; font-size:13px; line-height:1.5; }
  details{ margin-top:20px; } summary{ font-size:12px; color:var(--sub); cursor:pointer; }
  [hidden]{ display:none; }
</style>
</head>
<body>
  <div class="brand">🌙 밤새비서 <span>클리퍼</span></div>
  <div class="hint">로그인해두면, 툴바의 🌙 아이콘을 <b>클릭 한 번</b> 하는 것만으로<br>보고 있는 페이지가 밤새비서에 저장돼요.</div>

  <div id="inState" class="state" hidden>✅ 로그인됨 — 이제 아이콘만 누르면 저장돼요.</div>

  <div id="loginForm">
    <label>이메일</label><input id="email" type="email" placeholder="you@bambi.local">
    <label>비밀번호</label><input id="pw" type="password" placeholder="비밀번호">
    <button id="loginBtn">로그인</button>
  </div>
  <button id="logoutBtn" class="ghost" hidden>로그아웃</button>

  <details>
    <summary>서버 주소 설정</summary>
    <label>API 주소</label><input id="api" placeholder="https://…">
  </details>

  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
