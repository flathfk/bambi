# 부하 테스트 타깃용 최소 nginx.
#
# 운영 nginx.conf 를 그대로 쓰지 않는 이유: 인증서·도메인·web/admin/mcp upstream 이 필요하다.
# 여기서는 **운영과 같은 "nginx 를 한 번 거친다"는 조건만** 재현하고 API 만 프록시한다.
#
# 운영과 다른 점(결과 문서에 명시할 것): TLS 없음, HTTP/1.1, gzip 미설정.

user  nginx;
worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 부하 중 upstream 대기 시간을 응답 헤더로 볼 수 있게 남긴다.
    log_format  perf  '$remote_addr $status $request_time $upstream_response_time "$request"';
    access_log  /var/log/nginx/access.log  perf;

    sendfile        on;
    keepalive_timeout  65;

    upstream backend { server backend:8080; }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        location = /healthz {
            return 200 "ok\n";
        }
    }
}
