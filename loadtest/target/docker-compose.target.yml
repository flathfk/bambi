# 부하 테스트 **타깃** 스택 — 운영과 같은 사양의 임시 VM 에 올린다.
#
# 운영 compose 를 그대로 쓰지 않는 이유:
#   · agent-api·agent-db·워커 6개·MCP 는 읽기 경로에 관여하지 않는다. 띄우면 같은 4 vCPU 를
#     나눠 먹어 측정이 오염된다.
#   · 워커가 돌면 LLM 비용이 실제로 발생한다(2026-08-12 크레딧 소진 사건).
#   · service-web·admin-web 은 API 부하와 무관하다.
#
# 그래서 **nginx → backend → postgres** 3개만 띄운다. 운영과 다른 점은
# 결과 문서에 그대로 적는다(측정의 한계).
#
# 사용:
#   docker compose -f docker-compose.target.yml up -d
#   curl http://localhost/api/health

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.loadtest.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    # GHCR 패키지가 private 이라 임시 VM 에서 pull 이 안 된다(unauthorized).
    # 비밀값(PAT)을 VM 에 두는 대신 **public 레포를 clone 해 그 자리에서 빌드**한다.
    # 부수 효과로 측정 대상 코드의 커밋을 정확히 특정할 수 있다(결과 문서에 SHA 기록).
    build:
      context: ./bambi-service-api
      dockerfile: Dockerfile
    image: bambi-service-api:loadtest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bambi
      DB_USER: bambi
      DB_PASSWORD: bambi
      JWT_SECRET: loadtest-only-secret-0123456789abcdef0123456789abcdef
      # 생성 경로를 완전히 차단한다 — 부하 테스트는 읽기 경로만 잰다.
      AGENT_GENERATION_MODE: mock
      AGENT_PUBLISH_MODE: mock
      AGENT_IMMEDIATE_CARD_ENABLED: "false"
      SCHEDULER_GENERATION_ENABLED: "false"
      SCHEDULER_BRIEFING_PREFETCH_ENABLED: "false"
      # 커넥션 풀은 기본값(10)으로 시작한다. **측정 전에 올리지 않는다** —
      # 무엇이 병목이었는지 알 수 없게 된다. 재측정 때만 값을 준다.
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-}
    expose:
      - "8080"
    ports:
      - "8080:8080"      # nginx 경유와 직접 호출을 모두 재보려고 함께 연다
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bambi
      POSTGRES_USER: bambi
      POSTGRES_PASSWORD: bambi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambi -d bambi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
