# 부하 테스트 전용 compose override.
#
# 운영 compose 는 backend 를 GHCR 이미지로 받고 host 포트를 열지 않는다
# (expose 만 있고 ports 없음 — nginx 뒤에만 둔다). 부하 테스트는 두 가지가 필요하다.
#   1) 로컬 코드로 빌드해야 개선 전후를 비교할 수 있다.
#   2) k6 가 호스트에서 때리려면 포트가 열려 있어야 한다.
#
# ⚠️ 이 파일은 부하 테스트에만 쓴다. 운영 compose 에 절대 합치지 않는다.
#
# 사용:
#   cd bambi/bambi-build
#   docker compose -f docker-compose.yml -f ../loadtest/docker-compose.loadtest.yml \
#     up -d --build postgres backend
#
# 측정값의 의미:
#   로컬 Docker Desktop 결과는 **운영 서버의 최대 처리량이 아니다**. 같은 머신에서
#   부하 발생기와 DB 가 자원을 나눠 쓰기 때문이다. 이 수치는 (a) 개선 전후 상대 비교와
#   (b) 병목 지점 파악에만 쓴다.

services:
  backend:
    build:
      context: ../bambi-service-api
      dockerfile: Dockerfile
    image: bambi-service-api:loadtest
    ports:
      - "8080:8080"
    environment:
      # 부하 테스트는 생성 경로를 타지 않는다 — LLM 비용이 실제로 발생한다.
      SCHEDULER_GENERATION_ENABLED: "false"
      SCHEDULER_BRIEFING_PREFETCH_ENABLED: "false"
      AGENT_GENERATION_MODE: mock
      AGENT_PUBLISH_MODE: mock
      # 커넥션 풀은 **측정 전에 손대지 않는다**. 기본값(10)이 병목인지부터 확인한다.
      # 값을 바꿔 재측정할 때만 이 변수를 준다.
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-}
    # 풀 대기시간·pending thread 를 봐야 병목을 단정할 수 있다(active 수만으로는 부족).
    # actuator 가 열려 있으면 /actuator/metrics/hikaricp.connections.pending 로 확인한다.

  postgres:
    ports:
      - "55432:5432"      # 부하 중 pg_stat_activity 를 직접 볼 수 있게 연다
